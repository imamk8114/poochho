[build]
  command = "npm run build"
  publish = "dist"

# The service worker must always be re-checked, or an update to the app could be stuck behind a stale worker.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
